{% extends 'base.html' %}

{% block content %}

<h2>{{ course.name }}</h2>
<p>{{ course.duration }} months</p>
<p>Fees: Rs.{{ course.fees }}</p>

<h3>Student Enrolled</h3>

{% for student in course.students.all %}

    <p>{{student.name}} - {{ student.email }}</p> 

{% empty %}
    <p>No student Enrolled.</p>

{% endfor %}
    

    
{% endblock  %}
