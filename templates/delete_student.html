{% extends "base.html" %}

{% block content %}
<section class="delete-page">
    <div class="delete-card">
        <div class="delete-icon">!</div>
        <span class="delete-kicker">CONFIRM ACTION</span>
        <h1>Delete Student?</h1>
        <p>
            Are you sure you want to delete
            <strong>{{ student.name }}</strong>?
        </p>
        <p class="delete-warning">This action cannot be undone.</p>

        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="delete-confirm-btn">
                Yes, Delete Student
            </button>
        </form>

        <a href="{% url 'home' %}" class="delete-cancel-btn">Cancel and Go Back</a>
    </div>
</section>
{% endblock %}
